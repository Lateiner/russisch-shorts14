<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeltrainer: Russisch - Deutsch</title>
    <style>
        :root {
            --primary-green: #2d6a4f;
            --light-green: #95d5b2;
            --hover-green: #40916c;
            --bg-color: #f0f7f4;
            --card-white: #ffffff;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .progress {
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-green);
            font-size: 1.1rem;
        }

        /* Flashcard 3D Flip Setup */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: var(--shadow);
            border-radius: 15px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 15px;
            border: 4px solid var(--light-green);
            background: var(--card-white);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #f9fffb;
        }

        .text-main {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
            word-wrap: break-word;
            max-width: 100%;
        }

        .text-note {
            font-size: 1rem;
            color: #666;
            font-style: italic;
            margin-top: 10px;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            background-color: var(--primary-green);
            color: white;
            flex: 1;
        }

        button:hover {
            background-color: var(--hover-green);
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: var(--light-green);
            color: var(--primary-green);
        }

        .secondary-btn:hover {
            background-color: #74c69d;
        }

        .shortcuts-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }

        @media (max-width: 480px) {
            .flashcard-container { height: 250px; }
            .text-main { font-size: 1.4rem; }
            .controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vokabel-Lernkartei</h1>
    <div class="progress" id="progress">1 / 40</div>

    <div class="flashcard-container" id="cardContainer" onclick="flipCard()">
        <div class="flashcard" id="card">
            <div class="card-face card-front">
                <div class="text-main" id="frontText">Lädt...</div>
                <div class="text-note" id="frontNote"></div>
            </div>
            <div class="card-face card-back">
                <div class="text-main" id="backText">Lädt...</div>
                <div class="text-note" id="backNote"></div>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button onclick="prevCard()">← Vorherige</button>
        <button onclick="nextCard()">Nächste →</button>
    </div>

    <div class="controls" style="margin-top: 15px;">
        <button class="secondary-btn" onclick="shuffleCards()">🔀 Mischen</button>
        <button class="secondary-btn" onclick="goToStart()">🏠 An den Anfang</button>
    </div>

    <div class="shortcuts-hint">
        Tipp: Leertaste zum Umdrehen | Pfeiltasten zum Navigieren
    </div>
</div>

<script>
    // Die bereinigte Vokabelliste
    const originalVocabulary = [
        ["жужжáть / прожужжáть", "summen / vollsummen"],
        ["все", "alle"],
        ["ýхо / ýши", "Ohr / Ohren"],
        ["прожужжáть все ýши", "jemandem die Ohren vollquatschen", "", "(wörtlich: jemandem alle Ohren vollsummen)"],
        ["о / об", "über / von", "", "(Präposition mit Präpositional)"],
        ["ýмная", "kluge / schlaue"],
        ["сумка", "Tasche"],
        ["эта / этой", "diese / dieser", "", "(weiblich)"],
        ["подрýга", "Freundin"],
        ["парень", "Typ / Freund", "", "(fester Freund)"],
        ["этот / этом", "dieser / diesem", "", "(männlich)"],
        ["машина", "Auto"],
        ["новая", "neue"],
        ["друг", "Freund"],
        ["отпуск", "Urlaub"],
        ["свой / своём", "sein / eigenem"],
        ["учёba", "Studium / Lernen"],
        ["хватит", "es reicht / hör auf"],
        ["глаз / глаза", "Auge / Augen"],
        ["мозг / мозги", "Gehirn / Gehirne"],
        ["рука / руки", "Hand / Hände"],
        ["говорить / сказáть", "sprechen / sagen"],
        ["слушать / послушать", "hören / zuhören"],
        ["хотеть / захотеть", "wollen"],
        ["покупать / купить", "kaufen"],
        ["забывать / забыть", "vergessen"],
        ["знать / узнать", "wissen / erfahren"],
        ["мне", "mir"],
        ["теbe", "dir"],
        ["ей", "ihr"],
        ["ему", "ihm"],
        ["нам", "uns"],
        ["вам", "euch / Ihnen"],
        ["им", "ihnen"],
        ["Юля", "Julia"],
        ["мы", "wir"],
        ["я", "ich"],
        ["она", "sie"],
        ["он", "er"],
        ["они", "sie (Plural)"]
    ];

    let currentCards = [...originalVocabulary];
    let currentIndex = 0;

    const card = document.getElementById('card');
    const progressText = document.getElementById('progress');
    const frontText = document.getElementById('frontText');
    const backText = document.getElementById('backText');
    const frontNote = document.getElementById('frontNote');
    const backNote = document.getElementById('backNote');

    function updateCard() {
        // Karte zurücksetzen (Vorderseite zeigen)
        card.classList.remove('is-flipped');

        // Daten holen
        const data = currentCards[currentIndex];
        
        // Texte setzen
        frontText.innerText = data[0];
        backText.innerText = data[1];
        frontNote.innerText = data[2] || "";
        backNote.innerText = data[3] || "";

        // Fortschritt
        progressText.innerText = `${currentIndex + 1} / ${currentCards.length}`;

        // Dynamische Schriftgröße
        adjustFontSize(frontText);
        adjustFontSize(backText);
    }

    function adjustFontSize(element) {
        const length = element.innerText.length;
        if (length > 30) {
            element.style.fontSize = "1.2rem";
        } else if (length > 15) {
            element.style.fontSize = "1.5rem";
        } else {
            element.style.fontSize = "1.8rem";
        }
    }

    function flipCard() {
        card.classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < currentCards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    function shuffleCards() {
        for (let i = currentCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
        }
        currentIndex = 0;
        updateCard();
    }

    function goToStart() {
        currentIndex = 0;
        updateCard();
    }

    // Tastatursteuerung
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === 'Enter') {
            e.preventDefault();
            flipCard();
        } else if (e.key === 'ArrowRight') {
            nextCard();
        } else if (e.key === 'ArrowLeft') {
            prevCard();
        } else if (e.key === 'Home') {
            goToStart();
        }
    });

    // Initialisierung
    updateCard();
</script>

</body>
</html>
